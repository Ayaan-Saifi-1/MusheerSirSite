services:
  db:
    image: postgres:16-alpine
    container_name: musheer_site_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musheer_portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-musheer_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musheer_admin} -d ${POSTGRES_DB:-musheer_portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musheer_site_django
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dr_musheer_ahmad_portfolio_production_key_2026}
      DJANGO_DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,musheerahmad.jmi.ac.in}
      DATABASE_URL: postgres://${POSTGRES_USER:-musheer_admin}:${POSTGRES_PASSWORD:-secure_db_pass_2026}@db:5432/${POSTGRES_DB:-musheer_portfolio}
    volumes:
      - media_volume:/app/backend/media
      - static_volume:/app/backend/staticfiles
      - backup_volume:/app/backend/backups
    expose:
      - "8000"

  proxy:
    image: nginx:alpine
    container_name: musheer_site_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./frontend/dist:/var/www/frontend:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

volumes:
  postgres_data:
  media_volume:
  static_volume:
  backup_volume:
