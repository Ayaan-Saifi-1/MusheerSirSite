server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Certbot challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Django Media Uploads (Portraits, CV PDFs, Paper Attachments)
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Django Static Files (Unfold Admin Assets, Django Rest Framework)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Backend API and Modern Django-Unfold CMS Admin
    location ~ ^/(api|cms-admin|admin|robots\.txt|sitemap\.xml) {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Single-Page Frontend (Vite React Build)
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
